<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PrintTrack — Welcome</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">

  <!-- Google AdSense SDK Script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6055348642277254"
     crossorigin="anonymous"></script>

  <style>
    /* ───────────────────────────────────────────────────
       Login Page — Soft Light Mesh Glassmorphism
       Matches Skynex / app.html design language
       ─────────────────────────────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body.login-page {
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 15%,  rgba(219,234,254,0.9)  0%, transparent 42%),
        radial-gradient(circle at 88% 12%,  rgba(243,232,255,0.85) 0%, transparent 42%),
        radial-gradient(circle at 55% 85%,  rgba(252,231,243,0.7)  0%, transparent 48%),
        radial-gradient(circle at 80% 60%,  rgba(224,242,254,0.5)  0%, transparent 38%),
        #f8fafc;
      background-attachment: fixed;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 52px 20px 28px;
      overflow: hidden;
      position: relative;
    }

    /* Soft ambient orbs */
    body.login-page::before {
      content: '';
      position: fixed; top: -80px; left: -80px;
      width: 320px; height: 320px; border-radius: 50%;
      background: radial-gradient(circle, rgba(147,197,253,0.3), transparent 70%);
      pointer-events: none; z-index: 0;
    }
    body.login-page::after {
      content: '';
      position: fixed; bottom: -80px; right: -60px;
      width: 300px; height: 300px; border-radius: 50%;
      background: radial-gradient(circle, rgba(216,180,254,0.25), transparent 70%);
      pointer-events: none; z-index: 0;
    }

    .login-container {
      width: 100%; max-width: 380px;
      display: flex; flex-direction: column;
      align-items: center; z-index: 10;
    }

    /* ── Hero Section ── */
    .hero-section { text-align: center; margin-bottom: 30px; }

    .app-badge-icon {
      width: 76px; height: 76px; margin: 0 auto 20px;
      background: linear-gradient(135deg, #3b82f6, #a855f7);
      border-radius: 26px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.1rem;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.9),
        0 16px 40px rgba(99,102,241,0.22),
        0 4px 12px rgba(59,130,246,0.15);
      animation: badgePulse 3s ease-in-out infinite;
    }
    @keyframes badgePulse {
      0%,100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.9), 0 16px 40px rgba(99,102,241,0.22), 0 4px 12px rgba(59,130,246,0.15); }
      50%      { box-shadow: 0 0 0 1px rgba(255,255,255,0.9), 0 20px 50px rgba(168,85,247,0.3),  0 4px 12px rgba(59,130,246,0.2); }
    }

    .hero-title {
      font-size: 2.5rem; font-weight: 800;
      letter-spacing: -0.8px; color: #0f172a;
      margin-bottom: 6px; line-height: 1.1;
    }

    .hero-title em {
      font-family: 'Instrument Serif', serif;
      font-style: italic; font-weight: 400;
      font-size: 2.8rem; color: #a855f7; margin-left: 3px;
    }

    .hero-subtitle {
      font-size: 0.82rem; color: #64748b;
      font-weight: 500; line-height: 1.55;
      max-width: 270px; margin: 0 auto;
    }

    /* ── Feature Chips Row ── */
    .features-grid {
      display: flex; gap: 10px; justify-content: center;
      margin-bottom: 26px; flex-wrap: wrap;
    }

    .feature-chip {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 40px;
      padding: 7px 14px;
      display: flex; align-items: center; gap: 7px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .feature-chip .f-icon { font-size: 1rem; line-height: 1; }
    .feature-chip .f-label {
      font-size: 0.74rem; font-weight: 700;
      color: #334155; white-space: nowrap;
    }

    /* ── Login Card ── */
    .login-card {
      width: 100%;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.75);
      border-radius: 28px;
      padding: 24px 20px;
      box-shadow:
        0 16px 48px rgba(31,38,135,0.07),
        0 2px 8px rgba(0,0,0,0.04),
        0 0 0 1px rgba(255,255,255,0.6);
    }

    /* ── Google Button ── */
    .btn-google-native {
      width: 100%; padding: 15px 20px;
      background: #0f172a;
      color: #ffffff;
      border: none; border-radius: 16px;
      font-size: 0.95rem; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      box-shadow: 0 6px 20px rgba(15,23,42,0.18);
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .btn-google-native:hover  { background: #1e293b; transform: translateY(-1px); box-shadow: 0 10px 28px rgba(15,23,42,0.22); }
    .btn-google-native:active { transform: scale(0.97); }
    .btn-google-native img { width: 22px; height: 22px; flex-shrink: 0; background:#fff; border-radius:50%; padding:2px; }

    /* ── Footer Info ── */
    .login-footer-info {
      display: flex; align-items: center; gap: 7px;
      margin-top: 16px; justify-content: center;
      font-size: 0.74rem; color: #94a3b8;
      font-weight: 500;
    }
    .login-footer-info svg { flex-shrink: 0; }

    /* ── Login Message ── */
    .login-msg {
      display: none; margin-top: 12px;
      padding: 10px 14px; border-radius: 12px;
      font-size: 0.78rem; font-weight: 600; text-align: center; line-height: 1.4;
    }
    .login-msg.error { background: rgba(239,68,68,0.08);  color: #dc2626; border: 1px solid rgba(239,68,68,0.15); }
    .login-msg.warn  { background: rgba(245,158,11,0.08); color: #d97706; border: 1px solid rgba(245,158,11,0.15); }
    .login-msg.info  { background: rgba(59,130,246,0.08); color: #2563eb; border: 1px solid rgba(59,130,246,0.15); }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── App Footer ── */
    .app-footer {
      font-size: 0.7rem; color: #94a3b8;
      font-weight: 600; text-align: center; z-index: 10;
      margin-top: 16px;
    }

    /* ── AdSense container light theme ── */
    .ad-container {
      background: rgba(255,255,255,0.5) !important;
      border: 1px solid rgba(255,255,255,0.6);
    }
  </style>

</head>
<body class="login-page">

  <div class="login-container">

    <!-- App Hero Header -->
    <div class="hero-section">
      <div class="app-badge-icon">🖨️</div>
      <h1 class="hero-title">PrintTrack</h1>
      <p class="hero-subtitle">SNMC Daily Printer Reading & Paper Entry System</p>
    </div>

    <!-- Feature Highlights Chips -->
    <div class="features-grid">
      <div class="feature-chip">
        <div class="f-icon">🔒</div>
        <div class="f-label">Secure Auth</div>
      </div>
      <div class="feature-chip">
        <div class="f-icon">📊</div>
        <div class="f-label">Live Sheets</div>
      </div>
      <div class="feature-chip">
        <div class="f-icon">⚡</div>
        <div class="f-label">Fast Entry</div>
      </div>
    </div>

    <!-- Action Card -->
    <div class="login-card">
      <button class="btn-google-native" id="login-btn" onclick="handleLogin()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
        <span>Sign in with Google</span>
      </button>

      <div class="login-footer-info">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Use authorized Google account to log entries</span>
      </div>

      <div class="login-msg" id="login-msg"></div>

      <!-- Google AdSense Container (Login Page) -->
      <div class="ad-container" style="margin-top:14px; text-align:center; min-height:60px; background:rgba(255,255,255,0.02); border-radius:10px; display:flex; align-items:center; justify-content:center;">
        <ins class="adsbygoogle"
             style="display:block; width:100%;"
             data-ad-client="ca-pub-6055348642277254"
             data-ad-slot="1234567890"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
             window.addEventListener('load', function() {
               setTimeout(function() {
                 try {
                   (adsbygoogle = window.adsbygoogle || []).push({});
                 } catch (e) {}
               }, 300);
             });
        </script>
      </div>

    </div>

  </div>

  <footer class="app-footer">
    <p>SOFTTECHSEVA © 2026 • PrintTrack Pro PWA</p>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    // ── SUPPRESS PWA Install Popup (prevents loop in PWABuilder APK) ──
    // The beforeinstallprompt keeps firing in WebView/APK and blocking the UI.
    // We capture and permanently suppress it on the login page.
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      // Do NOT show the prompt — swallow it silently
      return false;
    });

    // ── DO NOT register service worker on login page ──
    // SW on login page can intercept navigation and cause reload loops in PWABuilder APK.
    // SW is registered only in app.html.

    const urlParams = new URLSearchParams(window.location.search);
    const msg = urlParams.get('msg');
    const msgEl = document.getElementById('login-msg');
    
    if (msg === 'token_expired') {
      msgEl.textContent = 'Session expired. Please sign in again to access Google Sheets.';
      msgEl.className = 'login-msg warn';
      msgEl.style.display = 'block';
    } else if (msg === 'not_signed_in') {
      msgEl.textContent = 'Please sign in with Google to continue.';
      msgEl.className = 'login-msg info';
      msgEl.style.display = 'block';
    }

    // Auto-redirect if already logged in
    if (getAccessToken() && getStoredUser()) {
      window.location.replace('app.html');
    }

    async function handleLogin() {
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span>&nbsp; Connecting...`;

      try {
        await signInWithGoogle();
        window.location.replace('app.html');
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `<img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google"> <span>Sign in with Google</span>`;
        msgEl.textContent = 'Sign in failed: ' + (err.message || err);
        msgEl.className = 'login-msg error';
        msgEl.style.display = 'block';
      }
    }
  </script>

</body>
</html>
