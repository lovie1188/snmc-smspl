<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PrintTrack — Daily Entry</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

  <!-- App Loading Screen -->
  <div id="app-loader">
    <div class="logo-spin">🖨️</div>
    <p style="color: var(--text-muted); font-size: 0.85rem; font-weight:600;">Loading PrintTrack...</p>
  </div>

  <!-- Native Header -->
  <header class="app-header">
    <div class="header-brand">
      <div class="icon">🖨️</div>
      <div>
        <div class="title">PrintTrack</div>
        <div class="subtitle">SNMC Daily Tracker</div>
      </div>
    </div>

    <!-- Top Right User Avatar & Dropdown Menu -->
    <div class="user-menu-wrapper">
      <button class="user-avatar-btn" id="avatar-btn" onclick="toggleUserDropdown(event)">
        <div class="avatar-circle">
          <span id="user-initials">U</span>
          <img id="user-photo" alt="Profile">
        </div>
      </button>

      <!-- Dropdown Popup -->
      <div class="user-dropdown" id="user-dropdown">
        <div class="dropdown-user-header">
          <div class="avatar-circle" style="width:40px; height:40px;">
            <span id="drop-user-initials">U</span>
            <img id="drop-user-photo" alt="Profile">
          </div>
          <div class="details">
            <div class="d-name" id="drop-user-name">User Name</div>
            <div class="d-email" id="drop-user-email">user@gmail.com</div>
          </div>
        </div>

        <button class="dropdown-item" onclick="showTab('entry'); closeDropdown();">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span>New Daily Entry</span>
        </button>

        <button class="dropdown-item" onclick="showTab('history'); loadHistory(); closeDropdown();">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>View History</span>
        </button>

        <button class="dropdown-item danger" onclick="signOut()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Sign Out</span>
        </button>
      </div>
    </div>
  </header>

  <!-- App Main Content -->
  <main class="app-main">

    <!-- TAB 1: NEW ENTRY FORM -->
    <section id="tab-entry" class="tab-panel active">
      <div class="native-card">
        <div class="section-title">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          New Rim Entry
        </div>

        <form id="entry-form" onsubmit="submitEntry(event)">
          
          <div class="form-row">
            <div class="form-group">
              <label>Serial No.</label>
              <input type="text" class="native-input" id="serial-no" readonly placeholder="Auto">
            </div>

            <div class="form-group">
              <label>Date <span class="req">*</span></label>
              <input type="date" class="native-input" id="entry-date" required>
            </div>
          </div>

          <div class="form-group">
            <label>Counter Number <span class="req">*</span></label>
            <select class="native-select" id="counter-select" required>
              <option value="">Loading counters...</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Rim Recieved</label>
              <input type="number" class="native-input" id="rim-recieved" placeholder="0" min="0" step="1" oninput="calcBalance()">
            </div>

            <div class="form-group">
              <label>Rim Issued</label>
              <input type="number" class="native-input" id="rim-issued" placeholder="0" min="0" step="1" oninput="calcBalance()">
            </div>
          </div>

          <div class="form-group">
            <label>Balance (Recieved - Issued)</label>
            <input type="number" class="native-input" id="rim-balance" readonly placeholder="0">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Received By</label>
              <input type="text" class="native-input" id="received-by" readonly placeholder="Auto account">
            </div>

            <div class="form-group">
              <label>Issued By</label>
              <input type="text" class="native-input" id="issued-by" placeholder="Issuer Name">
            </div>
          </div>

          <div class="form-group">
            <label>Remark</label>
            <textarea class="native-textarea" id="remark" rows="2" placeholder="Optional notes..."></textarea>
          </div>

          <button type="submit" class="btn-native-submit" id="submit-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
            Save Entry
          </button>

        </form>
      </div>
    </section>

    <!-- TAB 2: HISTORY TABLE -->
    <section id="tab-history" class="tab-panel">
      <div class="native-card">
        <div class="section-title">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Recent Daily Entries
        </div>

        <div class="table-container">
          <div id="history-loading" style="display:flex; align-items:center; justify-content:center; gap:10px; padding:24px; color:var(--text-muted); font-size:0.85rem;">
            <span class="spinner"></span> Loading sheet data...
          </div>

          <table class="native-table">
            <thead id="history-head"></thead>
            <tbody id="history-body"></tbody>
          </table>

          <div id="no-history" style="display:none; text-align:center; padding:36px; color:var(--text-dim);">
            <div style="font-size:2rem; margin-bottom:8px;">📝</div>
            <p>No entries found yet.</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Native Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-entry" onclick="showTab('entry')">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      <span>Entry</span>
    </button>
    
    <button class="nav-item" id="nav-history" onclick="showTab('history'); loadHistory();">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>History</span>
    </button>
  </nav>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/sheets.js"></script>
  <script src="assets/js/app.js"></script>

  <script>
    function toggleUserDropdown(e) {
      if (e) e.stopPropagation();
      const dropdown = document.getElementById('user-dropdown');
      const btn = document.getElementById('avatar-btn');
      dropdown.classList.toggle('show');
      btn.classList.toggle('active');
    }

    function closeDropdown() {
      const dropdown = document.getElementById('user-dropdown');
      const btn = document.getElementById('avatar-btn');
      if (dropdown) dropdown.classList.remove('show');
      if (btn) btn.classList.remove('active');
    }

    // Close dropdown on outside click
    document.addEventListener('click', (e) => {
      const wrapper = document.querySelector('.user-menu-wrapper');
      if (wrapper && !wrapper.contains(e.target)) {
        closeDropdown();
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>

</body>
</html>
